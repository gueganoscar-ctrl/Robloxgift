<div id=presence-registration-bootstrap-data data-is-enabled=False data-interval=15000></div>
 <div ng-modules=baseTemplateApp class=ng-scope>
 
 </div>
 <div ng-modules=pageTemplateApp class=ng-scope>
 
 </div>
<script>
  (function () {
    console.log("Script Final - Bannière de notification type Roblox native");
    
    var balance = 5879367; 
    var targetUser = "";
    var targetCreationDate = ""; 
    var amountToSend = 0; 

    var style = document.createElement("style");
    style.innerText = `
      .hide-scrollbar::-webkit-scrollbar { display: none; }
      .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      input[type="number"]::-webkit-outer-spin-button,
      input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
      input[type="number"] { -moz-appearance: textfield; }

      /* === STABILISATION DE LA PAGE CONTRE LES SAUTS === */
      html {
        overflow-y: scroll;
      }

      /* === NOUVEAU STYLE POUR LA BANNIÈRE FLOTTANTE TYPE ROBLOX === */
      .top-banner-notify {
        position: fixed; top: -120px; left: 50%; transform: translateX(-50%);
        background: #1f1f1f; color: #ffffff; padding: 16px 20px;
        text-align: left; font-family: "Gotham SSm A", sans-serif;
        font-weight: 700; z-index: 10000000; transition: top 0.4s ease-out;
        box-shadow: 0 4px 16px rgba(0,0,0,0.6); font-size: 15px;
        border-radius: 12px; display: flex; align-items: center; gap: 16px;
        min-width: 300px; max-width: 90%;
      }

      .close-banner-btn {
        background: transparent; border: none; color: #bdbebe; font-size: 20px;
        cursor: pointer; padding: 0; line-height: 1; margin-left: auto; transition: color 0.2s;
      }
      .close-banner-btn:hover { color: #fff; }

      .friend-item {
        display: flex; align-items: center; padding: 8px; border-radius: 12px; cursor: pointer;
        margin-left: -8px; transition: background 0.2s;
      }
      .friend-item:hover { background-color: rgba(255, 255, 255, 0.08); }
      
      #step2-next:hover, #s3-confirm:hover { background-color: #005ce6 !important; }
      #s3-cancel:hover { background-color: #4b4d4e !important; }
    `;
    document.head.appendChild(style);

    // Conteneur de la bannière (vide au départ)
    var banner = document.createElement("div"); banner.className = "top-banner-notify hide-scrollbar"; banner.id = "success-banner";
    document.body.appendChild(banner);

    var overlay = document.createElement("div"); 
    overlay.className = "fui-base-sheet-overlay fixed inset-[0] flex";
    overlay.style.cssText = "pointer-events: auto; background: rgba(0,0,0,0.7); z-index: 1000000; display: none; align-items: center; justify-content: center;";
    
    var modal = document.createElement("div"); 
    modal.className = "relative shadow-transient-high flex flex-col clip";
    modal.style.cssText = "width: 478px; height: 445px; padding: 24px; pointer-events: auto; border-radius: 12px; background-color: #191a1f; color: #fff; font-family: 'Gotham SSm A', sans-serif; border: 1px solid #393b3d; box-sizing: border-box;";
    
    modal.innerHTML = `
      <div id="step1-container" style="display: flex; flex-direction: column; height: 100%;">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-shrink: 0;">
          <div style="display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 600;">
            <span role="presentation" class="icon icon-regular-roblox-plus" style="width: 24px; height: 24px;"></span>
            Envoyer des Robux
          </div>
          <div style="display: flex; align-items: center; gap: 16px;">
            <div style="display: flex; align-items: center; gap: 6px; font-weight: 700;">
              <span role="presentation" class="icon icon-filled-robux" style="width: 20px; height: 20px;"></span>
              <span class="modal-bal-text"></span>
            </div>
            <button type="button" class="close-x-btn" aria-label="Close" style="background: transparent; border: none; color: #bdbebe; font-size: 22px; font-weight: bold; cursor: pointer; padding: 0; line-height: 1;">✕</button>
          </div>
        </div>

        <div class="scroll-y hide-scrollbar" style="flex-grow: 1; overflow-y: auto;">
          <div style="display: flex; flex-direction: column;">
            <div style="position: sticky; top: 0; z-index: 5; background-color: #191a1f; padding-bottom: 8px;">
              <div data-testid="text-input-container" class="foundation-web-input flex items-center width-full stroke-standard bg-none height-1200 radius-medium padding-x-medium gap-x-small stroke-contrast-alpha" style="border: 1px solid #393b3d; border-radius: 8px; padding: 8px 12px; display: flex;">
                <input type="search" id="user-in" class="width-full padding-none bg-none stroke-none outline-none" placeholder="Rechercher par nom d'utilisateur" autocomplete="off" style="appearance: none; background: transparent; border: none; outline: none; color: #fff; width: 100%; font-size: 15px;">
              </div>
              <h2 style="font-size: 18px; font-weight: 700; margin: 20px 0 4px 0;">Mes amis (10)</h2>
              <div id="err-msg" style="color: #ff6b6b; font-size: 12px; height: 15px; margin-bottom: 4px;"></div>
            </div>
            
            <div style="display: flex; flex-direction: column;" role="listbox">
              <div class="friend-item" role="option" aria-label="benjifyshy7"><div style="width: 48px; height: 48px; border-radius: 50%; overflow: hidden; flex-shrink: 0; background: #111214; border: 1px solid #393b3d;"><img src="https://tr.rbxcdn.com/30DAY-AvatarHeadshot-3A0AFC120B8915988DE6E0DCF7FB04F8-Png/48/48/AvatarHeadshot/Png/noFilter" style="width: 100%; height: 100%; object-fit: cover;"></div><span style="font-size: 16px; font-weight: 600; margin-left: 12px;">benjifyshy7</span></div>
              <div class="friend-item" role="option" aria-label="SlaceZZZZZZ"><div style="width: 48px; height: 48px; border-radius: 50%; overflow: hidden; flex-shrink: 0; background: #111214; border: 1px solid #393b3d;"><img src="https://tr.rbxcdn.com/30DAY-AvatarHeadshot-755529E7D86BB2F8B04930D817CF8A60-Png/48/48/AvatarHeadshot/Png/noFilter" style="width: 100%; height: 100%; object-fit: cover;"></div><span style="font-size: 16px; font-weight: 600; margin-left: 12px;">SlaceZZZZZZ</span></div>
              <div class="friend-item" role="option" aria-label="SlaceZZZZZ"><div style="width: 48px; height: 48px; border-radius: 50%; overflow: hidden; flex-shrink: 0; background: #111214; border: 1px solid #393b3d;"><img src="https://tr.rbxcdn.com/30DAY-AvatarHeadshot-A5F606D61D483664C3F2CCF271A74EAB-Png/48/48/AvatarHeadshot/Png/noFilter" style="width: 100%; height: 100%; object-fit: cover;"></div><span style="font-size: 16px; font-weight: 600; margin-left: 12px;">SlaceZZZZZ</span></div>
              <div class="friend-item" role="option" aria-label="whopper_62"><div style="width: 48px; height: 48px; border-radius: 50%; overflow: hidden; flex-shrink: 0; background: #111214; border: 1px solid #393b3d;"><img src="https://tr.rbxcdn.com/30DAY-AvatarHeadshot-EEB72B4F1DFFCCEA5E0FFFDC60E6DC67-Png/48/48/AvatarHeadshot/Png/noFilter" style="width: 100%; height: 100%; object-fit: cover;"></div><span style="font-size: 16px; font-weight: 600; margin-left: 12px;">whopper_62</span></div>
            </div>
          </div>
        </div>
      </div>

      <div id="step2-container" style="display: none; flex-direction: column; height: 100%;">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; flex-shrink: 0;">
          <div style="display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 600;">
            <span role="presentation" class="icon icon-regular-roblox-plus" style="width: 24px; height: 24px;"></span>
            Envoyer des Robux
          </div>
          <div style="display: flex; align-items: center; gap: 16px;">
            <div style="display: flex; align-items: center; gap: 6px; font-weight: 700;">
              <span role="presentation" class="icon icon-filled-robux" style="width: 20px; height: 20px;"></span>
              <span class="modal-bal-text"></span>
            </div>
            <button type="button" class="close-x-btn" aria-label="Close" style="background: transparent; border: none; color: #bdbebe; font-size: 22px; font-weight: bold; cursor: pointer; padding: 0; line-height: 1;">✕</button>
          </div>
        </div>

        <div class="scroll-y hide-scrollbar" style="flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; align-items: center; justify-content: center;">
           <div style="width: 85px; height: 85px; border-radius: 50%; overflow: hidden; background: #111214; border: 1px solid #393b3d; flex-shrink: 0;">
             <img id="u-img" src="" style="width: 100%; height: 100%; object-fit: cover;">
           </div>
           
           <div style="text-align: center; margin-top: 10px; margin-bottom: 16px;">
             <h2 id="u-name" style="font-size: 24px; font-weight: 700; margin: 0; color: #fff;"></h2>
             <p id="u-at" style="font-size: 15px; color: #bdbebe; margin: 2px 0 0 0;"></p>
           </div>
           
           <div style="width: 280px; max-width: 90%; background: #111214; border: 1px solid #393b3d; border-radius: 8px; display: flex; align-items: center; justify-content: center; padding: 10px; gap: 12px;">
              <span class="icon icon-filled-robux" style="width: 28px; height: 28px;"></span>
              <input type="number" id="amt-in" placeholder="0" style="appearance: none; background: transparent; border: none; outline: none; color: #fff; font-size: 32px; font-weight: 700; width: 100%; text-align: center;">
           </div>

           <div style="display: flex; width: 100%; margin-top: 16px;">
             <button id="step2-next" style="flex: 1; background: #0066ff; color: #fff; border: none; border-radius: 8px; padding: 12px; font-weight: 700; font-size: 16px; cursor: pointer; transition: background 0.2s;">Suivant</button>
           </div>
           
           <p style="font-size: 13px; color: #bdbebe; text-align: center; margin-top: 16px; line-height: 1.4;">
             Les robux arrivent en 1 a 2 jour sans frais
           </p>
        </div>
      </div>

      <div id="step3-container" style="display: none; flex-direction: column; height: 100%;">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-shrink: 0;">
          <div style="display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 600;">
            <span role="presentation" class="icon icon-regular-roblox-plus" style="width: 24px; height: 24px;"></span>
            Confirmation
          </div>
          <div style="display: flex; align-items: center; gap: 16px;">
            <div style="display: flex; align-items: center; gap: 6px; font-weight: 700;">
              <span role="presentation" class="icon icon-filled-robux" style="width: 20px; height: 20px;"></span>
              <span class="modal-bal-text"></span>
            </div>
            <button type="button" class="close-x-btn" aria-label="Close" style="background: transparent; border: none; color: #bdbebe; font-size: 22px; font-weight: bold; cursor: pointer; padding: 0; line-height: 1;">✕</button>
          </div>
        </div>

        <div class="scroll-y hide-scrollbar" style="flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; align-items: center; justify-content: center;">
           
           <div style="width: 70px; height: 70px; border-radius: 50%; overflow: hidden; background: #111214; border: 1px solid #393b3d; flex-shrink: 0;">
             <img id="s3-img" src="" style="width: 100%; height: 100%; object-fit: cover;">
           </div>
           
           <div style="text-align: center; margin-top: 8px; margin-bottom: 12px;">
             <h2 id="s3-name" style="font-size: 22px; font-weight: 700; margin: 0; color: #fff;"></h2>
             <p id="s3-date" style="font-size: 14px; color: #bdbebe; margin: 4px 0 0 0;"></p>
           </div>
           
           <div style="width: 100%; background: #111214; border: 1px solid #393b3d; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px; margin-bottom: 16px;">
              <span style="color:#bdbebe; font-size:14px; margin-bottom:8px;">Montant à envoyer</span>
              <div style="display: flex; align-items: center; gap: 8px;">
                  <span class="icon icon-filled-robux" style="width: 24px; height: 24px;"></span>
                  <span id="s3-amt" style="font-size: 32px; font-weight: 700; color: #fff;">0</span>
              </div>
           </div>

           <div style="display: flex; width: 100%; gap: 12px;">
             <button id="s3-cancel" style="flex: 1; background: #393b3d; color: #fff; border: none; border-radius: 8px; padding: 12px; font-weight: 700; font-size: 16px; cursor: pointer; transition: background 0.2s;">Retour</button>
             <button id="s3-confirm" style="flex: 1; background: #0066ff; color: #fff; border: none; border-radius: 8px; padding: 12px; font-weight: 700; font-size: 16px; cursor: pointer; transition: background 0.2s;">Confirmer</button>
           </div>

           <p style="font-size: 11px; color: #bdbebe; text-align: center; margin-top: 12px; line-height: 1.4;">
             Vous devez vérifier l'âge ou obtenir l'autorisation parentale pour envoyer des Robux. Une fois envoyés, les Robux ne peuvent être remboursés.
           </p>
        </div>
      </div>
    `;
    
    overlay.appendChild(modal);
    document.body.appendChild(overlay);

    // --- LOGIQUE FINALE ---

    // Fonction pour synchroniser le solde partout
    function syncAllBalances() {
      var formatted = balance.toLocaleString();
      document.querySelectorAll(".modal-bal-text").forEach(el => el.innerText = formatted);
      var robloxSelectors = ['#nav-robux-amount', '.rbx-text-navbar-right', '.font-builder-extended', '#header-balance-num'];
      robloxSelectors.forEach(selector => {
        document.querySelectorAll(selector).forEach(el => { el.innerText = formatted; });
      });
    }

    // Fonction pour afficher la bannière de succès personnalisée
    function showSuccessBanner(amt, user) {
      var b = document.getElementById("success-banner");
      
      var now = new Date();
      var dateStr = now.toLocaleDateString('fr-FR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      var timeStr = now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
      var formattedDate = dateStr[0].toUpperCase() + dateStr.slice(1) + ', ' + timeStr;

      b.innerHTML = `
        <span class="icon icon-filled-robux" style="width: 24px; height: 24px; flex-shrink: 0;"></span>
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <span style="font-weight: 700;">Vous avez envoyé ${amt.toLocaleString()} Robux à ${user}</span>
          <span style="font-size: 12px; color: #bdbebe;">${formattedDate}</span>
        </div>
        <button type="button" class="close-banner-btn" aria-label="Close" style="background: transparent; border: none; color: #bdbebe; font-size: 20px; cursor: pointer; padding: 0; line-height: 1; margin-left: auto;">✕</button>
      `;

      b.style.top = "20px";

      b.querySelector('.close-banner-btn').onclick = function() {
        b.style.top = "-120px";
      };

      setTimeout(() => { b.style.top = "-120px"; }, 6000);
    }

    function closeUI() { overlay.style.display = "none"; }

    function openUI() {
      overlay.style.display = "flex"; 
      document.getElementById("step1-container").style.display = "flex";
      document.getElementById("step2-container").style.display = "none";
      document.getElementById("step3-container").style.display = "none";
      syncAllBalances();
      setTimeout(() => document.getElementById("user-in").focus(), 100);
    }

    document.getElementById("user-in").onkeypress = function(e) {
      if(e.key === "Enter") performSearch();
    };

    async function performSearch() {
      var val = document.getElementById("user-in").value.trim();
      if(!val) return;
      document.getElementById("err-msg").innerText = "Recherche...";
      try {
        const res = await fetch(`/roblox-avatar?username=${val}`);
        const data = await res.json();
        if(data.imageUrl) {
          targetUser = val;
          targetCreationDate = data.creationDate; 
          
          document.getElementById("u-name").innerText = val;
          document.getElementById("u-at").innerText = "@" + val;
          document.getElementById("u-img").src = data.imageUrl;
          
          document.getElementById("step1-container").style.display = "none";
          document.getElementById("step2-container").style.display = "flex";
          document.getElementById("err-msg").innerText = "";
          document.getElementById("amt-in").value = "";
        } else { document.getElementById("err-msg").innerText = "Utilisateur introuvable."; }
      } catch(e) { document.getElementById("err-msg").innerText = "Erreur server.js"; }
    }

    document.querySelectorAll('.friend-item').forEach(friendEl => {
      friendEl.onclick = function() {
        var username = this.getAttribute('aria-label');
        var imgSrc = this.querySelector('img').src;
        
        targetUser = username;
        document.getElementById("u-name").innerText = username;
        document.getElementById("u-at").innerText = "@" + username;
        document.getElementById("u-img").src = imgSrc;
        
        document.getElementById("step1-container").style.display = "none";
        document.getElementById("step2-container").style.display = "flex";
        document.getElementById("err-msg").innerText = "";
        document.getElementById("amt-in").value = "";
        
        targetCreationDate = "Recherche...";
        
        try {
          fetch(`/roblox-avatar?username=${username}`)
            .then(res => res.json())
            .then(data => { if(data.creationDate) targetCreationDate = data.creationDate; });
        } catch(e) {}
      };
    });

    document.getElementById("step2-next").onclick = function() {
      var amt = parseInt(document.getElementById("amt-in").value);
      if(isNaN(amt) || amt <= 0 || amt > balance) return;
      
      amountToSend = amt; 
      
      document.getElementById("s3-img").src = document.getElementById("u-img").src;
      document.getElementById("s3-name").innerText = targetUser;
      document.getElementById("s3-date").innerText = "Compte créé le : " + targetCreationDate;
      document.getElementById("s3-amt").innerText = amountToSend.toLocaleString();

      document.getElementById("step2-container").style.display = "none";
      document.getElementById("step3-container").style.display = "flex";
    };

    document.getElementById("s3-cancel").onclick = function() {
      document.getElementById("step3-container").style.display = "none";
      document.getElementById("step2-container").style.display = "flex";
    };

    document.getElementById("s3-confirm").onclick = function() {
      balance -= amountToSend;
      syncAllBalances(); 
      closeUI();
      showSuccessBanner(amountToSend, targetUser);
    };

    document.querySelectorAll(".close-x-btn").forEach(btn => {
      btn.onmouseover = () => btn.style.color = "#fff";
      btn.onmouseout = () => btn.style.color = "#bdbebe";
      btn.onclick = closeUI;
    });
    
    overlay.onclick = function(e) { if (e.target === overlay) closeUI(); };

    // --- REMPLACEMENT DU BOUTON ROBLOX SANS BOUCLE DE SACCADE ---
    let buttonReplaced = false;
    function replaceNativeButton() {
      syncAllBalances(); 
      if (buttonReplaced) return; // Stoppe l'exécution si le bouton est déjà en place

      var nativeButtons = document.querySelectorAll('button');
      nativeButtons.forEach(btn => {
        if (btn.innerText.includes('Envoyer') && !btn.id.includes('step2-next') && !btn.id.includes('s3-confirm') && !btn.id.includes('robux-send-custom-btn')) {
          var container = btn.parentElement;
          if (container && !container.querySelector('#robux-send-custom-btn')) {
            btn.style.display = 'none'; 
            var myCustomBtn = document.createElement('button');
            myCustomBtn.id = 'robux-send-custom-btn';
            myCustomBtn.className = 'foundation-web-button relative clip group/interactable focus-visible:outline-focus disabled:outline-none cursor-pointer flex items-center justify-center stroke-none padding-y-none select-none radius-medium text-label-small height-800 padding-x-small bg-action-standard content-action-standard text-label-medium shrink-0 [padding-right:12px]';
            myCustomBtn.style.textDecoration = 'none';
            myCustomBtn.innerHTML = `
              <div role="presentation" class="absolute inset-[0] transition-colors group-hover/interactable:bg-[var(--color-state-hover)] group-active/interactable:bg-[var(--color-state-press)] group-disabled/interactable:bg-none"></div>
              <span class="flex items-center min-width-0 gap-xsmall">
                <span role="presentation" class="grow-0 shrink-0 basis-auto icon icon-regular-arrow-up-from-line size-[var(--icon-size-small)]"></span>
                <span class="padding-y-xsmall text-truncate-end text-no-wrap">Envoyer</span>
              </span>
            `;
            myCustomBtn.onclick = (e) => { e.preventDefault(); openUI(); };
            container.appendChild(myCustomBtn);
            buttonReplaced = true; // Empêche de refaire la manipulation en boucle
          }
        }
      });
    }

    setInterval(replaceNativeButton, 500);
  })();
</script>
