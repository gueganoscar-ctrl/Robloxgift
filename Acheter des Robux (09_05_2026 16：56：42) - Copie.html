<script>
  (function () {
    console.log("Script Final - Modale Roblox native v3 (Quantité perso + Historique Fix)");
    
    var balance = 3230425; 
    var targetUser = "";
    var targetCreationDate = ""; 
    var amountToSend = 0; 
    var selectedAmount = 0; 

    var style = document.createElement("style");
    style.innerText = `
      .hide-scrollbar::-webkit-scrollbar { display: none; }
      .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      /* Supprimer les flèches du champ de quantité personnalisé */
      input[type="number"]::-webkit-outer-spin-button,
      input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
      input[type="number"] { -moz-appearance: textfield; }

      html { overflow-y: scroll; }

      /* BANNIÈRE */
      .top-banner-notify {
        position: fixed; top: -120px; left: 50%; transform: translateX(-50%);
        background: #1f1f1f; color: #ffffff; padding: 16px 20px;
        text-align: left; font-family: "Gotham SSm A", sans-serif;
        font-weight: 700; z-index: 10000000; transition: top 0.4s ease-out;
        box-shadow: 0 4px 16px rgba(0,0,0,0.6); font-size: 15px;
        border-radius: 12px; display: flex; align-items: center; gap: 16px;
        min-width: 300px; max-width: 90%;
      }
      .close-banner-btn { background: transparent; border: none; color: #bdbebe; font-size: 20px; cursor: pointer; padding: 0; line-height: 1; margin-left: auto; transition: color 0.2s; }
      .close-banner-btn:hover { color: #fff; }

      /* HISTORIQUE ITEM */
      .friend-item { display: flex; align-items: center; padding: 10px; border-radius: 12px; cursor: pointer; margin-left: -8px; transition: background 0.2s; }
      .friend-item:hover { background-color: rgba(255, 255, 255, 0.08); }
      
      /* BOUTONS PRÉDÉFINIS */
      .preset-btn {
        background: #232527; border: 1px solid #393b3d; color: #fff;
        border-radius: 8px; padding: 8px 16px; font-size: 14px; font-weight: 700;
        display: flex; align-items: center; justify-content: center; gap: 6px;
        cursor: pointer; transition: background 0.2s, border 0.2s; flex: 1;
      }
      .preset-btn:hover { background: #393b3d; }
      .preset-btn.active { border: 1px solid #fff; background: #393b3d; }

      #step2-next:hover, #s3-confirm:hover { background-color: #005ce6 !important; }
      #s3-cancel:hover { background-color: #4b4d4e !important; }
      
      .user-info-meta { font-size: 13px; color: #bdbebe; display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 4px; }
    `;
    document.head.appendChild(style);

    var banner = document.createElement("div"); banner.className = "top-banner-notify hide-scrollbar"; banner.id = "success-banner";
    document.body.appendChild(banner);

    var overlay = document.createElement("div"); 
    overlay.className = "fui-base-sheet-overlay fixed inset-[0] flex";
    overlay.style.cssText = "pointer-events: auto; background: rgba(0,0,0,0.7); z-index: 1000000; display: none; align-items: center; justify-content: center;";
    
    var modal = document.createElement("div"); 
    modal.className = "relative shadow-transient-high flex flex-col clip";
    modal.style.cssText = "width: 440px; height: 520px; padding: 24px; pointer-events: auto; border-radius: 12px; background-color: #191a1f; color: #fff; font-family: 'Gotham SSm A', sans-serif; border: 1px solid #393b3d; box-sizing: border-box;";
    
    modal.innerHTML = `
      <!-- ÉTAPE 1 : Historique / Recherche -->
      <div id="step1-container" style="display: flex; flex-direction: column; height: 100%;">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-shrink: 0;">
          <div style="display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 600;">
            <span role="presentation" class="icon icon-regular-roblox-plus" style="width: 24px; height: 24px;"></span> Envoyer des Robux
          </div>
          <div style="display: flex; align-items: center; gap: 16px;">
            <div style="display: flex; align-items: center; gap: 6px; font-weight: 700;">
              <span role="presentation" class="icon icon-filled-robux" style="width: 20px; height: 20px;"></span>
              <span class="modal-bal-text"></span>
            </div>
            <button type="button" class="close-x-btn" aria-label="Close" style="background: transparent; border: none; color: #bdbebe; font-size: 22px; font-weight: bold; cursor: pointer; padding: 0; line-height: 1;">✕</button>
          </div>
        </div>

        <div class="scroll-y hide-scrollbar" style="flex-grow: 1; overflow-y: auto;">
          <div style="display: flex; flex-direction: column;">
            <div style="position: sticky; top: 0; z-index: 5; background-color: #191a1f; padding-bottom: 8px;">
              <div class="foundation-web-input flex items-center width-full stroke-standard bg-none height-1200 radius-medium padding-x-medium gap-x-small stroke-contrast-alpha" style="border: 1px solid #393b3d; border-radius: 8px; padding: 8px 12px; display: flex;">
                <input type="search" id="user-in" class="width-full padding-none bg-none stroke-none outline-none" placeholder="Rechercher par nom d'utilisateur" autocomplete="off" style="appearance: none; background: transparent; border: none; outline: none; color: #fff; width: 100%; font-size: 15px;">
              </div>
              <h2 style="font-size: 18px; font-weight: 700; margin: 20px 0 4px 0;">Historique des envois</h2>
              <div id="err-msg" style="color: #ff6b6b; font-size: 12px; height: 15px; margin-bottom: 4px;"></div>
            </div>
            
            <div style="display: flex; flex-direction: column;" role="listbox">
              <div class="friend-item" role="option" data-username="benjifyshy7" data-joined="14 juillet 2018">
                <div style="width: 48px; height: 48px; border-radius: 50%; overflow: hidden; flex-shrink: 0; background: #111214; border: 1px solid #393b3d;">
                  <img src="https://tr.rbxcdn.com/30DAY-AvatarHeadshot-3A0AFC120B8915988DE6E0DCF7FB04F8-Png/48/48/AvatarHeadshot/Png/noFilter" style="width: 100%; height: 100%; object-fit: cover;">
                </div>
                <div style="display: flex; flex-direction: column; margin-left: 12px; flex-grow: 1;">
                  <span style="font-size: 16px; font-weight: 600;">benjifyshy7</span>
                  <span style="font-size: 12px; color: #bdbebe;">Il y a 2 heures</span>
                </div>
                <div style="display: flex; align-items: center; gap: 4px; font-weight: 700; font-size: 15px;">
                  <span class="icon icon-filled-robux" style="width: 16px; height: 16px;"></span> 100
                </div>
              </div>
              <div class="friend-item" role="option" data-username="SlaceZZZZZZ" data-joined="21 février 2020">
                <div style="width: 48px; height: 48px; border-radius: 50%; overflow: hidden; flex-shrink: 0; background: #111214; border: 1px solid #393b3d;">
                  <img src="https://tr.rbxcdn.com/30DAY-AvatarHeadshot-755529E7D86BB2F8B04930D817CF8A60-Png/48/48/AvatarHeadshot/Png/noFilter" style="width: 100%; height: 100%; object-fit: cover;">
                </div>
                <div style="display: flex; flex-direction: column; margin-left: 12px; flex-grow: 1;">
                  <span style="font-size: 16px; font-weight: 600;">SlaceZZZZZZ</span>
                  <span style="font-size: 12px; color: #bdbebe;">Hier</span>
                </div>
                <div style="display: flex; align-items: center; gap: 4px; font-weight: 700; font-size: 15px;">
                  <span class="icon icon-filled-robux" style="width: 16px; height: 16px;"></span> 25
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- ÉTAPE 2 : Sélection du montant -->
      <div id="step2-container" style="display: none; flex-direction: column; height: 100%;">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-shrink: 0;">
          <div style="display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 600;">
            <span role="presentation" class="icon icon-regular-roblox-plus" style="width: 24px; height: 24px;"></span> Envoyer des Robux
          </div>
          <div style="display: flex; align-items: center; gap: 16px;">
            <div style="display: flex; align-items: center; gap: 6px; font-weight: 700;">
              <span role="presentation" class="icon icon-filled-robux" style="width: 20px; height: 20px;"></span>
              <span class="modal-bal-text"></span>
            </div>
            <button type="button" class="close-x-btn" aria-label="Close" style="background: transparent; border: none; color: #bdbebe; font-size: 22px; font-weight: bold; cursor: pointer; padding: 0; line-height: 1;">✕</button>
          </div>
        </div>

        <div class="scroll-y hide-scrollbar" style="flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; align-items: center;">
           <div style="width: 64px; height: 64px; border-radius: 50%; overflow: hidden; background: #111214; border: 1px solid #393b3d; flex-shrink: 0; margin-top: 10px;">
             <img id="u-img" src="" style="width: 100%; height: 100%; object-fit: cover;">
           </div>
           
           <div style="text-align: center; margin-top: 12px;">
             <h2 id="u-name" style="font-size: 18px; font-weight: 700; margin: 0; color: #fff;"></h2>
             <p id="u-at" style="font-size: 14px; color: #bdbebe; margin: 4px 0 0 0;"></p>
           </div>
           
           <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 12px; margin-bottom: 28px;">
              <div class="user-info-meta"><span style="font-size:14px; color:#a28ce0;">👥</span> 0 amis en commun</div>
              <div class="user-info-meta" id="u-joined">⏱️ Inscrit le : ...</div>
           </div>

           <!-- CHAMP DE SAISIE PERSONNALISÉ -->
           <div style="display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 24px;">
              <span class="icon icon-filled-robux" style="width: 36px; height: 36px;"></span>
              <input type="number" id="display-amt" value="0" min="0" style="appearance: none; background: transparent; border: none; outline: none; color: #fff; font-size: 48px; font-weight: 700; width: 140px; text-align: center; font-family: 'Gotham SSm A', sans-serif;">
           </div>

           <!-- Boutons de quantités -->
           <div style="display: flex; gap: 8px; width: 100%; max-width: 340px; margin-bottom: 24px;">
              <button class="preset-btn" data-val="25"><span class="icon icon-filled-robux" style="width:16px;height:16px;"></span> 25</button>
              <button class="preset-btn" data-val="50"><span class="icon icon-filled-robux" style="width:16px;height:16px;"></span> 50</button>
              <button class="preset-btn" data-val="100"><span class="icon icon-filled-robux" style="width:16px;height:16px;"></span> 100</button>
              <button class="preset-btn" data-val="200"><span class="icon icon-filled-robux" style="width:16px;height:16px;"></span> 200</button>
           </div>

           <div style="display: flex; width: 100%; margin-top: auto;">
             <button id="step2-next" style="width: 100%; background: #0066ff; color: #fff; border: none; border-radius: 8px; padding: 12px; font-weight: 700; font-size: 16px; cursor: pointer; transition: background 0.2s;">Suivant</button>
           </div>
        </div>
      </div>

      <!-- ÉTAPE 3 : Confirmation -->
      <div id="step3-container" style="display: none; flex-direction: column; height: 100%;">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-shrink: 0;">
          <div style="display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 600;">
            <span role="presentation" class="icon icon-regular-roblox-plus" style="width: 24px; height: 24px;"></span> Envoyer des Robux
          </div>
          <div style="display: flex; align-items: center; gap: 16px;">
            <div style="display: flex; align-items: center; gap: 6px; font-weight: 700;">
              <span role="presentation" class="icon icon-filled-robux" style="width: 20px; height: 20px;"></span>
              <span class="modal-bal-text"></span>
            </div>
            <button type="button" class="close-x-btn" aria-label="Close" style="background: transparent; border: none; color: #bdbebe; font-size: 22px; font-weight: bold; cursor: pointer; padding: 0; line-height: 1;">✕</button>
          </div>
        </div>

        <div class="scroll-y hide-scrollbar" style="flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; align-items: center;">
           
           <div style="width: 64px; height: 64px; border-radius: 50%; overflow: hidden; background: #111214; border: 1px solid #393b3d; flex-shrink: 0; margin-top: 10px;">
             <img id="s3-img" src="" style="width: 100%; height: 100%; object-fit: cover;">
           </div>
           
           <div style="text-align: center; margin-top: 12px;">
             <h2 id="s3-name" style="font-size: 18px; font-weight: 700; margin: 0; color: #fff;"></h2>
             <p id="s3-at" style="font-size: 14px; color: #bdbebe; margin: 4px 0 0 0;"></p>
           </div>
           
           <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 12px; margin-bottom: 28px;">
              <div class="user-info-meta"><span style="font-size:14px; color:#a28ce0;">👥</span> 0 amis en commun</div>
              <div class="user-info-meta" id="s3-joined">⏱️ Inscrit le : ...</div>
           </div>
           
           <div style="display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 32px;">
              <span class="icon icon-filled-robux" style="width: 36px; height: 36px;"></span>
              <span id="s3-amt" style="font-size: 48px; font-weight: 700; color: #fff;">0</span>
           </div>

           <div style="display: flex; width: 100%; gap: 12px; margin-top: auto;">
             <button id="s3-confirm" style="flex: 1.5; background: #0066ff; color: #fff; border: none; border-radius: 8px; padding: 12px; font-weight: 700; font-size: 16px; cursor: pointer; transition: background 0.2s;">Envoyer</button>
             <button id="s3-cancel" style="flex: 1; background: #393b3d; color: #fff; border: none; border-radius: 8px; padding: 12px; font-weight: 700; font-size: 16px; cursor: pointer; transition: background 0.2s;">Modifier</button>
           </div>

           <p style="font-size: 11px; color: #bdbebe; text-align: center; margin-top: 16px; line-height: 1.4;">
             Vous devez vérifier l'âge ou obtenir l'autorisation parentale pour envoyer des Robux. Une fois envoyés, vous ne pouvez pas annuler.
           </p>
        </div>
      </div>
    `;
    
    overlay.appendChild(modal);
    document.body.appendChild(overlay);

    // --- LOGIQUE FINALE ---

    const amtInput = document.getElementById('display-amt');

    function syncAllBalances() {
      var formatted = balance.toLocaleString().replace(/,/g, ' ');
      document.querySelectorAll(".modal-bal-text").forEach(el => el.innerText = formatted);
      var robloxSelectors = ['#nav-robux-amount', '.rbx-text-navbar-right', '.font-builder-extended', '#header-balance-num'];
      robloxSelectors.forEach(selector => {
        document.querySelectorAll(selector).forEach(el => { el.innerText = formatted; });
      });
    }

    function showSuccessBanner(amt, user) {
      var b = document.getElementById("success-banner");
      var now = new Date();
      var dateStr = now.toLocaleDateString('fr-FR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      var timeStr = now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
      var formattedDate = dateStr[0].toUpperCase() + dateStr.slice(1) + ', ' + timeStr;

      b.innerHTML = `
        <span class="icon icon-filled-robux" style="width: 24px; height: 24px; flex-shrink: 0;"></span>
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <span style="font-weight: 700;">Vous avez envoyé ${amt.toLocaleString().replace(/,/g, ' ')} Robux à ${user}</span>
          <span style="font-size: 12px; color: #bdbebe;">${formattedDate}</span>
        </div>
        <button type="button" class="close-banner-btn" aria-label="Close" style="background: transparent; border: none; color: #bdbebe; font-size: 20px; cursor: pointer; padding: 0; line-height: 1; margin-left: auto;">✕</button>
      `;
      b.style.top = "20px";
      b.querySelector('.close-banner-btn').onclick = function() { b.style.top = "-120px"; };
      setTimeout(() => { b.style.top = "-120px"; }, 6000);
    }

    function closeUI() { 
      overlay.style.display = "none"; 
      selectedAmount = 0;
      amtInput.value = "0";
      document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
    }

    function openUI() {
      overlay.style.display = "flex"; 
      document.getElementById("step1-container").style.display = "flex";
      document.getElementById("step2-container").style.display = "none";
      document.getElementById("step3-container").style.display = "none";
      syncAllBalances();
      setTimeout(() => document.getElementById("user-in").focus(), 100);
    }

    // Gestion du champ input personnalisé
    amtInput.addEventListener('input', function() {
      document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
      let val = parseInt(this.value);
      if(isNaN(val) || val < 0) {
        val = 0;
      }
      selectedAmount = val;
    });

    // Gestion des boutons prédéfinis
    document.querySelectorAll('.preset-btn').forEach(btn => {
      btn.onclick = function() {
        document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        selectedAmount = parseInt(this.getAttribute('data-val'));
        amtInput.value = selectedAmount;
      };
    });

    document.getElementById("user-in").onkeypress = function(e) {
      if(e.key === "Enter") performSearch();
    };

    async function performSearch() {
      var val = document.getElementById("user-in").value.trim();
      if(!val) return;
      document.getElementById("err-msg").innerText = "Recherche...";
      try {
        const res = await fetch(`/roblox-avatar?username=${val}`);
        const data = await res.json();
        if(data.imageUrl) {
          targetUser = val;
          targetCreationDate = data.creationDate; 
          
          document.getElementById("u-name").innerText = val;
          document.getElementById("u-at").innerText = "@" + val;
          document.getElementById("u-img").src = data.imageUrl;
          document.getElementById("u-joined").innerText = "⏱️ Inscrit le : " + targetCreationDate;
          
          document.getElementById("step1-container").style.display = "none";
          document.getElementById("step2-container").style.display = "flex";
          document.getElementById("err-msg").innerText = "";
        } else { document.getElementById("err-msg").innerText = "Utilisateur introuvable."; }
      } catch(e) { document.getElementById("err-msg").innerText = "Erreur server.js"; }
    }

    // Historique 100% Fonctionnel
    document.querySelectorAll('.friend-item').forEach(friendEl => {
      friendEl.onclick = function() {
        var username = this.getAttribute('data-username');
        var joinedDate = this.getAttribute('data-joined');
        var imgSrc = this.querySelector('img').src;
        
        targetUser = username;
        targetCreationDate = joinedDate;
        
        document.getElementById("u-name").innerText = username;
        document.getElementById("u-at").innerText = "@" + username;
        document.getElementById("u-img").src = imgSrc;
        document.getElementById("u-joined").innerText = "⏱️ Inscrit le : " + targetCreationDate;
        
        document.getElementById("step1-container").style.display = "none";
        document.getElementById("step2-container").style.display = "flex";
        document.getElementById("err-msg").innerText = "";
        
        selectedAmount = 0;
        amtInput.value = "0";
        document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
      };
    });

    document.getElementById("step2-next").onclick = function() {
      // Met à jour la quantité au cas où l'utilisateur a tapé sans cliquer
      let finalAmt = parseInt(amtInput.value);
      if(isNaN(finalAmt) || finalAmt <= 0 || finalAmt > balance) {
          amtInput.style.color = "#ff6b6b"; // Indique une erreur visuelle si montant invalide
          setTimeout(() => amtInput.style.color = "#fff", 1000);
          return;
      }
      
      amountToSend = finalAmt; 
      
      document.getElementById("s3-img").src = document.getElementById("u-img").src;
      document.getElementById("s3-name").innerText = targetUser;
      document.getElementById("s3-at").innerText = "@" + targetUser;
      document.getElementById("s3-joined").innerText = "⏱️ Inscrit le : " + targetCreationDate;
      document.getElementById("s3-amt").innerText = amountToSend.toLocaleString().replace(/,/g, ' ');

      document.getElementById("step2-container").style.display = "none";
      document.getElementById("step3-container").style.display = "flex";
    };

    document.getElementById("s3-cancel").onclick = function() {
      document.getElementById("step3-container").style.display = "none";
      document.getElementById("step2-container").style.display = "flex";
    };

    document.getElementById("s3-confirm").onclick = function() {
      balance -= amountToSend;
      syncAllBalances(); 
      closeUI();
      showSuccessBanner(amountToSend, targetUser);
    };

    document.querySelectorAll(".close-x-btn").forEach(btn => {
      btn.onmouseover = () => btn.style.color = "#fff";
      btn.onmouseout = () => btn.style.color = "#bdbebe";
      btn.onclick = closeUI;
    });
    
    overlay.onclick = function(e) { if (e.target === overlay) closeUI(); };

    let buttonReplaced = false;
    function replaceNativeButton() {
      syncAllBalances(); 
      if (buttonReplaced) return; 

      var nativeButtons = document.querySelectorAll('button');
      nativeButtons.forEach(btn => {
        if (btn.innerText.includes('Envoyer') && !btn.id.includes('step2-next') && !btn.id.includes('s3-confirm') && !btn.id.includes('robux-send-custom-btn')) {
          var container = btn.parentElement;
          if (container && !container.querySelector('#robux-send-custom-btn')) {
            btn.style.display = 'none'; 
            var myCustomBtn = document.createElement('button');
            myCustomBtn.id = 'robux-send-custom-btn';
            myCustomBtn.className = 'foundation-web-button relative clip group/interactable focus-visible:outline-focus disabled:outline-none cursor-pointer flex items-center justify-center stroke-none padding-y-none select-none radius-medium text-label-small height-800 padding-x-small bg-action-standard content-action-standard text-label-medium shrink-0 [padding-right:12px]';
            myCustomBtn.style.textDecoration = 'none';
            myCustomBtn.innerHTML = `
              <div role="presentation" class="absolute inset-[0] transition-colors group-hover/interactable:bg-[var(--color-state-hover)] group-active/interactable:bg-[var(--color-state-press)] group-disabled/interactable:bg-none"></div>
              <span class="flex items-center min-width-0 gap-xsmall">
                <span role="presentation" class="grow-0 shrink-0 basis-auto icon icon-regular-arrow-up-from-line size-[var(--icon-size-small)]"></span>
                <span class="padding-y-xsmall text-truncate-end text-no-wrap">Envoyer</span>
              </span>
            `;
            myCustomBtn.onclick = (e) => { e.preventDefault(); openUI(); };
            container.appendChild(myCustomBtn);
            buttonReplaced = true; 
          }
        }
      });
    }

    setInterval(replaceNativeButton, 500);
  })();
</script>
